name: CI/CD - Orbital Sentinel

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "README.md"
      - "CODE_OF_CONDUCT.md"
      - "SECURITY.md"
      - "LICENCE.md"
      - "docs/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_VERSION: 10.0.x
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/orbital-sentinel
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build:
    name: Verify backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: dotnet restore OrbitalSentinel.slnx --locked-mode
      - run: dotnet build OrbitalSentinel.slnx --no-restore --configuration Release
      - run: dotnet test OrbitalSentinel.slnx --no-build --configuration Release

  frontend:
    name: Verify frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: src/orbital-sentinel-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/orbital-sentinel-web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  deployment_config:
    name: Verify deployment configuration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose and deployment scripts
        env:
          POSTGRES_PASSWORD: ci-validation-only
        run: |
          docker compose config --quiet
          docker compose -f compose.production.yaml config --quiet
          for script in deploy/*.sh tests/deployment/*.sh; do bash -n "$script"; done
          shellcheck -x deploy/*.sh tests/deployment/*.sh
          bash tests/deployment/docker-access.test.sh
          bash tests/deployment/smoke-test.test.sh

  docker_image:
    name: Build and push ARM64 images
    needs: [build, frontend, deployment_config]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Build and publish API, worker, and web images
        env:
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ github.actor }}
        shell: bash
        run: |
          set -euo pipefail
          source deploy/docker-access.sh
          select_docker_command
          printf '%s' "$GHCR_TOKEN" | "${docker_command[@]}" login ghcr.io -u "$GHCR_USER" --password-stdin
          image_prefix="${IMAGE_PREFIX,,}"
          for target in api workers; do
            "${docker_command[@]}" build \
              --pull --platform linux/arm64 --target "$target" \
              --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
              --tag "$image_prefix-$target:$IMAGE_TAG" \
              --tag "$image_prefix-$target:latest" --push .
          done
          "${docker_command[@]}" build \
            --platform linux/arm64 \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --tag "$image_prefix-web:$IMAGE_TAG" \
            --tag "$image_prefix-web:latest" --push src/orbital-sentinel-web

  deploy:
    name: Deploy to production
    needs: docker_image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://orbital-sentinel.igorcouto.com
    permissions:
      contents: read
      packages: read
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          : "${SSH_HOST:?SSH_HOST is required}" "${SSH_USER:?SSH_USER is required}" "${SSH_KEY:?SSH_KEY is required}"
          SSH_PORT=${SSH_PORT:-22}
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" > ~/.ssh/known_hosts
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Upload release configuration
        shell: bash
        run: |
          set -euo pipefail
          SSH_PORT=${SSH_PORT:-22}
          release="apps/orbital-sentinel/releases/$IMAGE_TAG"
          ssh -o BatchMode=yes -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "umask 077; mkdir -p '$release'"
          scp -o BatchMode=yes -P "$SSH_PORT" compose.production.yaml deploy/deploy.sh deploy/smoke-test.sh deploy/docker-access.sh \
            "$SSH_USER@$SSH_HOST:$release/"

      - name: Deploy complete stack and verify web, API, and SignalR
        env:
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ github.actor }}
        shell: bash
        run: |
          set -euo pipefail
          SSH_PORT=${SSH_PORT:-22}
          image_prefix="${IMAGE_PREFIX,,}"
          printf '%s\n' "$GHCR_TOKEN" | ssh -o BatchMode=yes -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "bash 'apps/orbital-sentinel/releases/$IMAGE_TAG/deploy.sh' '$image_prefix' '$IMAGE_TAG' '$GHCR_USER'"
