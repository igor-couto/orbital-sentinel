name: orbital-sentinel

x-app-environment: &app-environment
  ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=orbital_sentinel;Username=orbital;Password=${POSTGRES_PASSWORD:-orbital_local_only}
  Kafka__BootstrapServers: kafka:9092
  CelesTrak__BaseUrl: https://celestrak.org/NORAD/elements/gp.php
  CelesTrak__Groups__0: stations
  CelesTrak__Groups__1: visual
  CelesTrak__Groups__2: iridium-33-debris
  CelesTrak__MaxObjects: 500
  CelesTrak__RequestIntervalMinutes: 120
  Prediction__HorizonHours: 24
  Prediction__StepSeconds: 60

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: orbital_sentinel
      POSTGRES_USER: orbital
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orbital_local_only}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbital -d orbital_sentinel"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:4.0.1
    hostname: kafka
    ports:
      - "127.0.0.1:19092:19092"
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  backend:
    build:
      context: .
      target: api
    environment: *app-environment
    ports:
      - "127.0.0.1:5080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  workers:
    build:
      context: .
      target: workers
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  frontend:
    build:
      context: ./src/orbital-sentinel-web
    ports:
      - "127.0.0.1:${WEB_PORT:-8088}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
  kafka-data:
