# Reference site for the host's /etc/nginx/sites-available/orbital-sentinel.
# The pipeline uses the existing host Nginx configuration; it does not overwrite it.
server {
    listen 80;
    listen [::]:80;
    server_name orbital-sentinel.igorcouto.com;

    location / {
        proxy_pass http://127.0.0.1:50190;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
    }
}
